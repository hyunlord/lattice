name: Public repository gallery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cli/**'
      - 'viewer/**'
      - 'browser/**'
      - 'bin/**'
      - 'examples/gallery/**'
      - 'tools/build-gallery.mjs'
      - 'tools/build-viewer.mjs'
      - 'tools/viewer-*.mjs'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/gallery.yml'
permissions:
  contents: read
concurrency:
  group: public-gallery-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:package
      - name: Export pinned public sources without running their scripts
        run: >-
          node tools/build-gallery.mjs
          --manifest examples/gallery/repositories.json
          --output "${{ runner.temp }}/gallery-site"
          --sources "${{ runner.temp }}/gallery-sources"
          --cache "${{ runner.temp }}/gallery-cache"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/gallery-site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deploy
