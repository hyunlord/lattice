schemaVersion: 1
name: Charter & Kin · module dependencies
include: [src/**/*.ts, src/**/*.tsx, public/assets/world_asset_manifest.json]
kinds:
  - id: module
    label: Source module
    files: [src/**/*.ts, src/**/*.tsx]
    columns: [language, 'facet:importCount']
  - id: accepted-asset
    label: Accepted asset reference
    files: [public/assets/world_asset_manifest.json]
    records: /acceptedReferences
    idField: key
    nameField: key
    columns: [width, height, path]
facets:
  - id: module-language
    key: language
    kinds: [module]
    value: {op: get, from: node, path: [language]}
  - id: import-count
    key: importCount
    kinds: [module]
    value: {op: count, value: {op: get, from: node, path: [imports]}}
views:
  - id: module-gallery
    type: gallery
    label: Source module cards
    description: Browse source language and declared imports, then follow a dependency to its source. Static declarations do not prove runtime execution.
    query: {kinds: [module]}
    edgeKinds: [imports]
    columns:
      - id: language
        label: Source language
        role: badge
        value: {op: get, from: node, path: [language]}
      - id: imports
        label: Declared imports
        role: badge
        value: {op: count, value: {op: get, from: node, path: [imports]}}
  - id: import-distribution
    type: distribution
    label: Imports per module
    query: {kinds: [module]}
    groupBy: {op: count, value: {op: get, from: node, path: [imports]}}
  - id: language-imports
    type: matrix
    label: Language and import count
    query: {kinds: [module]}
    row: {op: get, from: node, path: [language]}
    column: {op: count, value: {op: get, from: node, path: [imports]}}
  - id: imports
    type: cycle
    label: Module dependencies
    query: {kinds: [module]}
    edgeKinds: [imports]
findings:
  - id: many-imports
    query:
      kinds: [module]
      where:
        op: gte
        left: {op: count, value: {op: get, from: node, path: [imports]}}
        right: 10
    metrics:
      count: {op: count, value: {op: get, from: vars, path: [targets]}}
    severity: info
    basis: computed
    template: '{count} source modules declare at least 10 imports.'
    implementation: Static import declarations include external modules. This review threshold is descriptive, not a quality gate or runtime-use claim.
presentation:
  loop:
    title: Source structure and dependencies
    lead: Read the selected source modules and authored asset references. Static dependencies do not
      establish runtime behavior.
    center:
      title: Repository
      description: Read-only source
    catalogKinds:
      - module
      - accepted-asset
    stages: []
    flows: []
    strips:
      - title: Accepted asset references
        description: Authored paths and sizes; independent visual acceptance is not implied.
        kinds:
          - accepted-asset
    places:
      title: Source files
      kinds: []
    relationGroups:
      - label: Imported by
        side: left
        kinds:
          - module
        steps:
          - edgeKinds:
              - imports
            direction: in
      - label: Declared dependencies
        side: right
        kinds:
          - module
        steps:
          - edgeKinds:
              - imports
            direction: out
  name: Charter & Kin
  description: Read-only TypeScript module map. Static imports show source dependencies, not gameplay or runtime acceptance. Tracked src TypeScript modules and manifest accepted-reference metadata are selected. Asset approval is the manifest claim; images are not visually validated by this map.
  home:
    viewIds: [module-gallery, imports, import-distribution]
    findings: true
    inventory: true
    distributions: false
  detail:
    summaryFields:
      - {label: Source language, path: [language]}
    relationships:
      - {label: Declared dependencies, edgeKinds: [imports], direction: outgoing}
      - {label: Imported by, edgeKinds: [imports], direction: incoming}
    rawAttributes: collapsed
  facets:
    language: {label: Source language}
    importCount: {label: Declared imports}
